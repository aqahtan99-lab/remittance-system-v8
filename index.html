<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f3d5e">
<title>نظام الحوالات</title>

<style>
:root{
 --nav:#0f3d5e;
 --bg:#f4f7fa;
 --card:#fff;
 --text:#183247;
 --muted:#718096;
 --line:#dbe4ec;
 --ok:#15803d;
 --bad:#b91c1c;
}

*{box-sizing:border-box}

body{
 margin:0;
 font-family:Tahoma,Arial,sans-serif;
 background:var(--bg);
 color:var(--text);
}

button,input,select,textarea{
 font:inherit;
}

button{
 cursor:pointer;
}

.app{
 display:flex;
 min-height:100vh;
}

.side{
 width:245px;
 background:linear-gradient(180deg,var(--nav),#092b42);
 color:#fff;
 padding:20px 14px;
 position:fixed;
 top:0;
 bottom:0;
 right:0;
 z-index:5;
}

.brand{
 font-size:21px;
 font-weight:800;
 padding:10px 8px 22px;
}

.nav button{
 width:100%;
 border:0;
 background:transparent;
 color:#dcecf6;
 text-align:right;
 padding:13px 12px;
 border-radius:10px;
 margin:2px 0;
}

.nav button.active,
.nav button:hover{
 background:rgba(255,255,255,.12);
 color:#fff;
}

.main{
 margin-right:245px;
 width:calc(100% - 245px);
 padding:22px;
 max-width:1600px;
}

.top{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:15px;
 margin-bottom:18px;
}

.title h1{
 margin:0 0 4px;
 font-size:26px;
}

.muted{
 color:var(--muted);
 font-size:13px;
}

.sync{
 background:#fff;
 border:1px solid var(--line);
 padding:9px 12px;
 border-radius:10px;
 font-size:13px;
}

.grid{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:14px;
}

.card{
 background:var(--card);
 border:1px solid var(--line);
 border-radius:15px;
 padding:17px;
 box-shadow:0 4px 14px rgba(17,44,67,.05);
}

.stat .num{
 font-size:25px;
 font-weight:800;
 margin-top:8px;
}

.stat .label{
 color:var(--muted);
 font-size:13px;
}

.section{
 margin-top:18px;
}

.section-head{
 display:flex;
 justify-content:space-between;
 align-items:center;
 margin-bottom:10px;
}

.section-head h2{
 font-size:18px;
 margin:0;
}

.btn{
 border:0;
 border-radius:10px;
 padding:10px 14px;
 background:var(--nav);
 color:#fff;
}

.btn.secondary{
 background:#e8eef3;
 color:var(--text);
}

.btn.ok{
 background:var(--ok);
}

.btn.danger{
 background:var(--bad);
}

.btn.small{
 padding:7px 10px;
 font-size:12px;
}

.toolbar{
 display:flex;
 gap:8px;
 flex-wrap:wrap;
 margin-bottom:12px;
}

.toolbar input,
.toolbar select,
.form input,
.form select,
.form textarea{
 width:100%;
 background:#fff;
 border:1px solid var(--line);
 border-radius:9px;
 padding:10px;
 outline:none;
}

.toolbar input{
 min-width:220px;
 width:auto;
}

.tablewrap{
 overflow:auto;
}

.table{
 width:100%;
 border-collapse:collapse;
 background:#fff;
}

.table th,
.table td{
 padding:11px 9px;
 border-bottom:1px solid var(--line);
 white-space:nowrap;
 text-align:right;
}

.table th{
 background:#f8fafc;
 font-size:13px;
}

.empty{
 text-align:center;
 color:var(--muted);
 padding:30px;
}

.form{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:12px;
}

.form .full{
 grid-column:1/-1;
}

.form label{
 display:flex;
 flex-direction:column;
 gap:6px;
 font-size:13px;
 font-weight:700;
}

.form textarea{
 min-height:90px;
 resize:vertical;
}

.actions{
 display:flex;
 gap:8px;
 flex-wrap:wrap;
 margin-top:15px;
}

.modal{
 position:fixed;
 inset:0;
 background:rgba(0,0,0,.45);
 display:none;
 align-items:center;
 justify-content:center;
 padding:18px;
 z-index:20;
}

.modal.show{
 display:flex;
}

.modalbox{
 background:#fff;
 width:min(760px,100%);
 max-height:90vh;
 overflow:auto;
 border-radius:16px;
 padding:20px;
}

.close{
 float:left;
 border:0;
 background:#eef2f6;
 border-radius:8px;
 padding:5px 9px;
}

.mobilebar{
 display:none;
}

.badge{
 display:inline-block;
 padding:5px 8px;
 border-radius:8px;
 background:#eef2f6;
 font-size:12px;
}

.badge.ok{
 background:#dcfce7;
 color:#166534;
}

.badge.bad{
 background:#fee2e2;
 color:#991b1b;
}

hr{
 border:0;
 border-top:1px solid var(--line);
 margin:20px 0;
}

@media(max-width:900px){

 .side{
  display:none;
 }

 .main{
  margin:0;
  width:100%;
  padding:14px;
  padding-bottom:90px;
 }

 .grid{
  grid-template-columns:repeat(2,1fr);
 }

 .form{
  grid-template-columns:1fr;
 }

 .form .full{
  grid-column:auto;
 }

 .mobilebar{
  display:flex;
  position:fixed;
  bottom:0;
  right:0;
  left:0;
  background:#fff;
  border-top:1px solid var(--line);
  z-index:10;
  overflow-x:auto;
 }

 .mobilebar button{
  flex:1 0 16.666%;
  min-width:68px;
  border:0;
  background:#fff;
  padding:7px 3px 9px;
  font-size:11px;
  color:var(--text);
 }

 .mobilebar button.active{
  color:var(--nav);
  font-weight:800;
 }

 .top{
  align-items:flex-start;
 }

 .title h1{
  font-size:21px;
 }

}
</style>

<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore-compat.js"></script>

</head>

<body>

<div class="app">

<aside class="side">

<div class="brand">
💰 نظام الحوالات
</div>

<div class="nav" id="nav"></div>

</aside>

<main class="main">

<div class="top">

<div class="title">

<h1 id="pageTitle">الرئيسية</h1>

<div class="muted">
إدارة العملاء والشركات والحوالات والتسديدات
</div>

</div>

<div class="sync" id="sync">
🔐 غير مسجل
</div>

</div>

<div id="view"></div>

</main>

</div>

<div class="mobilebar" id="mobilebar"></div>

<div class="modal" id="modal">

<div class="modalbox">

<button class="close" onclick="closeModal()">✕</button>

<div id="modalBody"></div>

</div>

</div>

<script>

/* =====================================================
   FIREBASE CONFIG
   ===================================================== */

const firebaseConfig = {

 apiKey: "ضع_API_KEY_هنا",

 authDomain: "remittance-system-f14e0.firebaseapp.com",

 projectId: "remittance-system-f14e0",

 storageBucket: "remittance-system-f14e0.firebasestorage.app",

 messagingSenderId: "80599079461",

 appId: "1:80599079461:web:433f5892cb3bad29e2fdcc"

};


/* =====================================================
   FIREBASE
   ===================================================== */

let firebaseReady = false;
let db = null;
let auth = null;
let remoteUnsub = null;
let applyingRemote = false;
let savingRemote = false;

try{

 firebase.initializeApp(firebaseConfig);

 db = firebase.firestore();

 auth = firebase.auth();

 firebaseReady = true;

}catch(e){

 console.error(e);

}


/* =====================================================
   DATA
   ===================================================== */

const KEY = "remit_app_v3";

const DEFAULT_STATE = {

 customers: [],

 companies: [],

 transfers: [],

 payments: [],

 clears: [],

 settings: {

  office:"نظام الحوالات",

  updatedAt:0

 }

};

let state =
 JSON.parse(localStorage.getItem(KEY) || "null")
 ||
 JSON.parse(JSON.stringify(DEFAULT_STATE));

state.customers = state.customers || [];
state.companies = state.companies || [];
state.transfers = state.transfers || [];
state.payments = state.payments || [];
state.clears = state.clears || [];
state.settings = state.settings || {};

state.settings.office =
 state.settings.office || "نظام الحوالات";

state.settings.updatedAt =
 Number(state.settings.updatedAt || 0);

let page = "dashboard";
let editId = null;


/* =====================================================
   NAVIGATION
   ===================================================== */

const navs = [

 ["dashboard","🏠","الرئيسية"],

 ["customers","👤","العملاء"],

 ["companies","🏢","الشركات"],

 ["transfers","💸","الحوالات"],

 ["statements","📊","كشف الحساب"],

 ["payments","💰","التسديدات"],

 ["clears","🔄","المقاصة"],

 ["reports","📈","التقارير"],

 ["alerts","🔔","التنبيهات"],

 ["settings","⚙️","الإعدادات"]

];

function setPage(p){

 page = p;

 render();

}

function renderNav(){

 document.getElementById("nav").innerHTML =
 navs.map(n => `

 <button
 class="${page === n[0] ? "active" : ""}"
 onclick="setPage('${n[0]}')">

 ${n[1]} ${n[2]}

 </button>

 `).join("");

 document.getElementById("mobilebar").innerHTML =
 navs.slice(0,6).map(n => `

 <button
 class="${page === n[0] ? "active" : ""}"
 onclick="setPage('${n[0]}')">

 ${n[1]}<br>${n[2]}

 </button>

 `).join("");

}

function render(){

 renderNav();

 const current =
  navs.find(n => n[0] === page);

 document.getElementById("pageTitle").textContent =
  current ? current[2] : "الرئيسية";

 switch(page){

  case "dashboard":
   dashboard();
   break;

  case "customers":
   customers();
   break;

  case "companies":
   companies();
   break;

  case "transfers":
   transfers();
   break;

  case "statements":
   statements();
   break;

  case "payments":
   payments();
   break;

  case "clears":
   clears();
   break;

  case "reports":
   reports();
   break;

  case "alerts":
   alerts();
   break;

  case "settings":
   settings();
   break;

  default:
   dashboard();

 }

}


/* =====================================================
   HELPERS
   ===================================================== */

function money(value,currency){

 const n = Number(value || 0);

 return n.toLocaleString(
  "en-US",
  {
   minimumFractionDigits:
    currency === "IQD" ? 0 : 2,

   maximumFractionDigits:
    currency === "IQD" ? 0 : 2
  }
 ) + " " + (currency || "");

}

function nextId(prefix,list){

 return prefix +
 String(list.length + 1).padStart(6,"0");

}

function customer(id){

 return state.customers.find(
  x => x.id === id
 );

}

function company(id){

 return state.companies.find(
  x => x.id === id
 );

}


/* =====================================================
   SAVE
   ===================================================== */

function saveLocal(){

 state.settings.updatedAt = Date.now();

 localStorage.setItem(
  KEY,
  JSON.stringify(state)
 );

 const sync =
  document.getElementById("sync");

 if(sync && auth && auth.currentUser){

  sync.textContent =
   "☁️ جارٍ الحفظ...";

 }else if(sync){

  sync.textContent =
   "💾 محفوظ محلياً";

 }

 if(!applyingRemote){

  syncPush();

 }

}


/* =====================================================
   FIREBASE PUSH
   ===================================================== */

async function syncPush(){

 if(
  !firebaseReady ||
  !auth ||
  !auth.currentUser ||
  !db ||
  applyingRemote ||
  savingRemote
 ){

  return;

 }

 savingRemote = true;

 try{

  await db
   .collection("users")
   .doc(auth.currentUser.uid)
   .set({

    updatedAt:
     Number(
      state.settings.updatedAt ||
      Date.now()
     ),

    data:
     JSON.parse(
      JSON.stringify(state)
     )

   });

  const sync =
   document.getElementById("sync");

  if(sync){

   sync.textContent =
    "☁️ تمت المزامنة";

  }

 }catch(e){

  console.error(e);

  const sync =
   document.getElementById("sync");

  if(sync){

   sync.textContent =
    "⚠️ تعذر الحفظ السحابي";

  }

 }finally{

  savingRemote = false;

 }

}


/* =====================================================
   FIREBASE REALTIME
   ===================================================== */

function startCloudSync(){

 if(!firebaseReady || !auth || !db){

  return;

 }

 auth.onAuthStateChanged(async user => {

  if(remoteUnsub){

   remoteUnsub();

   remoteUnsub = null;

  }

  const sync =
   document.getElementById("sync");

  if(!user){

   if(sync){

    sync.textContent =
     "🔐 غير مسجل";

   }

   return;

  }

  if(sync){

   sync.textContent =
    "☁️ الاتصال بالسحابة...";

  }

  const ref =
   db.collection("users")
   .doc(user.uid);

  remoteUnsub = ref.onSnapshot(

   async snap => {

    if(!snap.exists){

     await syncPush();

     return;

    }

    const remote =
     snap.data() || {};

    const remoteTime =
     Number(remote.updatedAt || 0);

    const localTime =
     Number(
      state.settings.updatedAt || 0
     );

    if(remote.data && remoteTime > localTime){

     applyingRemote = true;

     state = remote.data;

     state.customers =
      state.customers || [];

     state.companies =
      state.companies || [];

     state.transfers =
      state.transfers || [];

     state.payments =
      state.payments || [];

     state.clears =
      state.clears || [];

     state.settings =
      state.settings || {};

     state.settings.office =
      state.settings.office ||
      "نظام الحوالات";

     state.settings.updatedAt =
      remoteTime;

     localStorage.setItem(
      KEY,
      JSON.stringify(state)
     );

     render();

     applyingRemote = false;

     if(sync){

      sync.textContent =
       "☁️ تم تحديث البيانات من السحابة";

     }

    }else if(
     remote.data &&
     localTime > remoteTime
    ){

     await syncPush();

    }else{

     if(sync){

      sync.textContent =
       "☁️ متزامن";

     }

    }

   },

   error => {

    console.error(error);

    if(sync){

     sync.textContent =
      "⚠️ خطأ في الاتصال بالسحابة";

    }

   }

  );

 });

}


/* =====================================================
   LOGIN
   ===================================================== */

async function loginFirebase(){

 if(!firebaseReady){

  alert(
   "Firebase غير مهيأ. ضع apiKey الصحيح أولاً."
  );

  return;

 }

 if(auth.currentUser){

  alert(
   "أنت مسجل الدخول بالفعل."
  );

  return;

 }

 const email =
  prompt(
   "أدخل بريد مستخدم Firebase:"
  );

 if(!email){

  return;

 }

 const password =
  prompt(
   "أدخل كلمة مرور Firebase:"
  );

 if(!password){

  return;

 }

 try{

  await auth.signInWithEmailAndPassword(
   email.trim(),
   password
  );

  alert(
   "✅ تم تسجيل الدخول بنجاح"
  );

  render();

 }catch(e){

  alert(
   "❌ فشل تسجيل الدخول:\n" +
   e.message
  );

 }

}


/* =====================================================
   LOGOUT
   ===================================================== */

async function logoutFirebase(){

 if(!auth || !auth.currentUser){

  alert(
   "لا يوجد حساب مسجل الدخول."
  );

  return;

 }

 try{

  await auth.signOut();

  alert(
   "تم تسجيل الخروج"
  );

  render();

 }catch(e){

  alert(e.message);

 }

}


/* =====================================================
   MANUAL SYNC
   ===================================================== */

async function syncNow(){

 if(!auth || !auth.currentUser){

  alert(
   "🔐 سجّل الدخول إلى Firebase أولاً."
  );

  return;

 }

 await syncPush();

 alert(
  "☁️ تمت المزامنة"
 );

}


/* =====================================================
   BACKUP
   ===================================================== */

function backup(){

 const blob =
  new Blob(
   [
    JSON.stringify(
     state,
     null,
     2
    )
   ],
   {
    type:"application/json"
   }
  );

 const url =
  URL.createObjectURL(blob);

 const a =
  document.createElement("a");

 a.href = url;

 a.download =
  "remittance-backup.json";

 a.click();

 setTimeout(() => {

  URL.revokeObjectURL(url);

 },1000);

}


/* =====================================================
   RESTORE
   ===================================================== */

function restore(input){

 const file =
  input.files &&
  input.files[0];

 if(!file){

  return;

 }

 const reader =
  new FileReader();

 reader.onload = () => {

  try{

   const data =
    JSON.parse(
     reader.result
    );

   if(
    !Array.isArray(data.customers) ||
    !Array.isArray(data.companies) ||
    !Array.isArray(data.transfers)
   ){

    throw new Error();

   }

   state = data;

   state.payments =
    state.payments || [];

   state.clears =
    state.clears || [];

   state.settings =
    state.settings || {};

   state.settings.updatedAt =
    Date.now();

   localStorage.setItem(
    KEY,
    JSON.stringify(state)
   );

   saveLocal();

   render();

   alert(
    "✅ تمت استعادة النسخة الاحتياطية"
   );

  }catch(e){

   alert(
    "❌ ملف النسخة الاحتياطية غير صالح"
   );

  }

 };

 reader.readAsText(file);

}


/* =====================================================
   MODAL
   ===================================================== */

function modal(html){

 document.getElementById(
  "modalBody"
 ).innerHTML = html;

 document.getElementById(
  "modal"
 ).classList.add("show");

}

function closeModal(){

 document.getElementById(
  "modal"
 ).classList.remove("show");

 editId = null;

}


/* =====================================================
   DASHBOARD
   ===================================================== */

function dashboard(){

 const today =
  new Date()
  .toISOString()
  .slice(0,10);

 const todayTransfers =
  state.transfers.filter(
   t => t.date === today
  );

 const totalToday =
  todayTransfers.reduce(
   (sum,t) =>
    sum + Number(t.amount || 0),
   0
  );

 const commissionToday =
  todayTransfers.reduce(
   (sum,t) =>
    sum + Number(t.commission || 0),
   0
  );

 document.getElementById("view").innerHTML = `

 <div class="grid">

  <div class="card stat">

   <div class="label">
    👤 العملاء
   </div>

   <div class="num">
    ${state.customers.length}
   </div>

  </div>

  <div class="card stat">

   <div class="label">
    🏢 الشركات
   </div>

   <div class="num">
    ${state.companies.length}
   </div>

  </div>

  <div class="card stat">

   <div class="label">
    💸 حوالات اليوم
   </div>

   <div class="num">
    ${todayTransfers.length}
   </div>

  </div>

  <div class="card stat">

   <div class="label">
    💰 عمولات اليوم
   </div>

   <div class="num">
    ${money(commissionToday,"USD")}
   </div>

  </div>

 </div>

 <div class="section card">

  <div class="section-head">

   <h2>
    🚀 إجراءات سريعة
   </h2>

  </div>

  <div class="actions">

   <button
   class="btn"
   onclick="openTransfer()">

   ➕ حوالة

   </button>

   <button
   class="btn secondary"
   onclick="openCustomer()">

   👤 عميل

   </button>

   <button
   class="btn secondary"
   onclick="openCompany()">

   🏢 شركة

   </button>

   <button
   class="btn secondary"
   onclick="setPage('statements')">

   📊 كشف حساب

   </button>

  </div>

 </div>

 <div class="section card">

  <h2>
   📌 ملخص اليوم
  </h2>

  <p>
   عدد الحوالات:
   <b>${todayTransfers.length}</b>
  </p>

  <p>
   إجمالي مبالغ اليوم:
   <b>${money(totalToday,"USD")}</b>
  </p>

 </div>

 <div class="section card">

  <h2>
   ⚠️ الحوالات المتأخرة
  </h2>

  ${lateRows()}

 </div>

 `;

}


/* =====================================================
   LATE TRANSFERS
   ===================================================== */

function lateRows(){

 const now =
  Date.now();

 const rows =
  state.transfers
  .map(t => {

   const d =
    new Date(t.date).getTime();

   const days =
    Math.floor(
     (now-d)/86400000
    );

   return {
    ...t,
    days
   };

  })
  .filter(
   t => t.days >= 15
  )
  .sort(
   (a,b) => b.days-a.days
  );

 if(!rows.length){

  return `
   <div class="empty">
    لا توجد حوالات متأخرة
   </div>
  `;

 }

 return `

 <div class="tablewrap">

 <table class="table">

 <thead>

 <tr>

  <th>الرقم</th>
  <th>التاريخ</th>
  <th>العميل</th>
  <th>الشركة</th>
  <th>المبلغ</th>
  <th>العمر</th>

 </tr>

 </thead>

 <tbody>

 ${rows.slice(0,30).map(t => `

 <tr>

  <td>${t.id}</td>

  <td>${t.date}</td>

  <td>
   ${customer(t.customerId)?.name || "-"}
  </td>

  <td>
   ${company(t.companyId)?.name || "-"}
  </td>

  <td>
   ${money(t.amount,t.currency)}
  </td>

  <td>
   ${t.days} يوم
  </td>

 </tr>

 `).join("")}

 </tbody>

 </table>

 </div>

 `;

}


/* =====================================================
   CUSTOMER BALANCE
   ===================================================== */

function balanceCustomer(cid){

  USD:0,
  IQD:0
 };

 state.transfers
 .filter(
  t => t.customerId === cid
 )
 .forEach(t => {

  b[t.currency] =
   (b[t.currency] || 0) +
   Number(
    t.total ||
    t.amount ||
    0
   );

 });

 state.payments
 .filter(
  p => p.customerId === cid
 )
 .forEach(p => {

  if(p.direction === "له"){

   b[p.currency] =
    (b[p.currency] || 0) -
    Number(p.amount || 0);

  }else{

   b[p.currency] =
    (b[p.currency] || 0) +
    Number(p.amount || 0);

  }

 });

 state.clears
 .filter(
  c => c.customerId === cid
 )
 .forEach(c => {

  if(
   c.direction ===
   "شركة إلى عميل"
  ){

   b[c.currency] =
    (b[c.currency] || 0) -
    Number(c.amount || 0);

  }else{

   b[c.currency] =
    (b[c.currency] || 0) +
    Number(c.amount || 0);

  }

 });

 return b;

}

  <label>

   العميل

   <select id="fCustomer">

   ${state.customers.map(c => `

   <option value="${c.id}">
    ${c.name}
   </option>

   `).join("")}

   </select>

  </label>

  <label>

   التاريخ

   <input
   id="fDate"
   type="date"
   value="${new Date().toISOString().slice(0,10)}">

  </label>

  <label>

   العملة

   <select id="fCurrency">

    <option value="USD">
     USD
    </option>

    <option value="IQD">
     IQD
    </option>

   </select>

  </label>

  <label>

   المبلغ

   <input
   id="fAmount"
   type="number"
   step="any">

  </label>

 </div>

 <div class="actions">

  <button
  class="btn"
  onclick="saveClear()">

  💾 حفظ

  </button>

 </div>

 `);

}

function saveClear(){

 const amount =
  Number(
   document.getElementById(
    "fAmount"
   ).value
  );

 if(!amount || amount <= 0){

  alert(
   "أدخل المبلغ"
  );

  return;

 }

 state.clears.push({

  id:
   nextId(
    "CLR",
    state.clears
   ),

  direction:
   document.getElementById(
    "fDirection"
   ).value,

  companyId:
   document.getElementById(
    "fCompany"
   ).value,

  customerId:
   document.getElementById(
    "fCustomer"
   ).value,

  date:
   document.getElementById(
    "fDate"
   ).value,

  currency:
   document.getElementById(
    "fCurrency"
   ).value,

  amount:amount

 });

 closeModal();

 saveLocal();

 render();

}

   STATEMENTS
   ===================================================== */

function statements(){

 document.getElementById("view").innerHTML = `

 <div class="card">

  <h2>
   📊 كشف الحساب
  </h2>

  <div class="toolbar">

   <select
   id="stType"
   onchange="statementForm()">

    <option value="customer">
     👤 عميل
    </option>

    <option value="company">
     🏢 شركة
    </option>

   </select>

   <select id="stId"></select>

   <select id="stCur">

    <option value="USD">
     USD
    </option>

    <option value="IQD">
     IQD
    </option>

   </select>

   <input
   id="stFrom"
   type="date">

   <input
   id="stTo"
   type="date">

   <button
   class="btn"
   onclick="showStatement()">

   🔎 عرض

   </button>

  </div>

  <div id="statementResult"></div>

 </div>

 `;

 statementForm();

}

function statementForm(){

 const type =
  document.getElementById(
   "stType"
  ).value;

 const arr =
  type === "customer"
  ? state.customers
  : state.companies;

 document.getElementById(
  "stId"
 ).innerHTML =

 arr.map(x => `

 <option value="${x.id}">
  ${x.name}
 </option>

 `).join("");

}

function showStatement(){

 const type =
  document.getElementById(
   "stType"
  ).value;

 const idv =
  document.getElementById(
   "stId"
  ).value;

 const cur =
  document.getElementById(
   "stCur"
  ).value;

 const from =
  document.getElementById(
   "stFrom"
  ).value;

 const to =
  document.getElementById(
   "stTo"
  ).value;

 let rows = [];


 /* الحوالات */

 state.transfers

 .filter(t =>

  (
   type === "customer"
   ? t.customerId === idv
   : t.companyId === idv
  )

  &&

  t.currency === cur

 )

 .forEach(t => {

  rows.push({

   date:t.date,

   debit:
    type === "customer"
    ? Number(
       t.total ||
       t.amount ||
       0
      )
    : Number(
       t.amount || 0
      ),

   credit:0,

   description:"حوالة"

  });

 });


 /* التسديدات */

 state.payments

 .filter(p =>

  (
   type === "customer"
   ? p.customerId === idv
   : p.companyId === idv
  )

  &&

  p.currency === cur

 )

 .forEach(p => {

  rows.push({

   date:p.date,

   debit:
    p.direction === "له"
    ? 0
    : Number(
       p.amount || 0
      ),

   credit:
    p.direction === "له"
    ? Number(
       p.amount || 0
      )
    : 0,

   description:"تسديد"

  });

 });


 /* المقاصة */

 state.clears

 .filter(c =>

  (
   type === "customer"
   ? c.customerId === idv
   : c.companyId === idv
  )

  &&

  c.currency === cur

 )

 .forEach(c => {

  if(
   c.direction ===
   "شركة إلى عميل"
  ){

   rows.push({

    date:c.date,

    debit:
     type === "company"
     ? Number(c.amount)
     : 0,

    credit:
     type === "customer"
     ? Number(c.amount)
     : 0,

    description:"مقاصة"

   });

  }else{

   rows.push({

    date:c.date,

    debit:
     type === "customer"
     ? Number(c.amount)
     : 0,

    credit:
     type === "company"
     ? Number(c.amount)
     : 0,

    description:"مقاصة"

   });

  }

 });

 rows =
  rows
  .filter(r =>

   (!from || r.date >= from) &&

   (!to || r.date <= to)

  )
  .sort((a,b) =>

   String(a.date)
   .localeCompare(
    String(b.date)
   )

  );

 let balance = 0;

 rows =
  rows.map(r => {

   balance +=
    Number(r.debit || 0) -
    Number(r.credit || 0);

   return {
    ...r,
    balance
   };

  });

 document.getElementById(
  "statementResult"
 ).innerHTML = `

 <div class="tablewrap">

 <table class="table">

 <thead>

 <tr>

  <th>التاريخ</th>
  <th>البيان</th>
  <th>عليه</th>
  <th>له</th>
  <th>الرصيد</th>

 </tr>

 </thead>

 <tbody>

 ${
  rows.map(r => `

  <tr>

   <td>
    ${r.date}
   </td>

   <td>
    ${r.description}
   </td>

   <td>
    ${
     r.debit
     ? money(r.debit,cur)
     : "-"
    }
   </td>

   <td>
    ${
     r.credit
     ? money(r.credit,cur)
     : "-"
    }
   </td>

   <td>
    ${money(r.balance,cur)}
   </td>

  </tr>

  `).join("")

  ||

  `

  <tr>

   <td
   colspan="5"
   class="empty">

   لا توجد حركات

   </td>

  </tr>

  `
 }

 </tbody>

 </table>

 </div>

 <div
 class="card"
 style="margin-top:12px">

 <b>
  الرصيد النهائي:
 </b>

 ${money(balance,cur)}

 </div>

 `;

}

   </div>

  </div>

 </div>

 <div class="section card">

  <h2>
   📊 أرصدة العملاء
  </h2>

  <div class="tablewrap">

  <table class="table">

  <thead>

  <tr>

   <th>العميل</th>

     <td>

   }).join("")
  }

}
