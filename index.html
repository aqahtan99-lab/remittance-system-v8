<script>

/* =========================
   FIREBASE
========================= */

const firebaseConfig = {
  apiKey: "AIzaSyDDJPXRbikippVRsDYDWAqNseyvtwZtoKI",
  authDomain: "remittance-system-f14e0.firebaseapp.com",
  projectId: "remittance-system-f14e0",
  storageBucket: "remittance-system-f14e0.firebasestorage.app",
  messagingSenderId: "80599079461",
  appId: "1:80599079461:web:433f5892cb3bad29e2fdcc",
  measurementId: "G-GYQ321NGTK"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

/* =========================
   DATA
========================= */

let data = {
  customers: [],
  companies: [],
  transfers: [],
  payments: []
};

let currentUser = null;

/* =========================
   AUTH
========================= */

function login(){
  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPassword").value;

  if(!email || !password){
    showLoginMessage("اكتب البريد الإلكتروني وكلمة المرور","error");
    return;
  }

  auth.signInWithEmailAndPassword(email,password)
  .then(()=>{
    showLoginMessage("تم تسجيل الدخول","success");
  })
  .catch(error=>{
    showLoginMessage(error.message,"error");
  });
}

function register(){
  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPassword").value;

  if(!email || !password){
    showLoginMessage("اكتب البريد الإلكتروني وكلمة المرور","error");
    return;
  }

  if(password.length < 6){
    showLoginMessage("كلمة المرور يجب أن تكون 6 أحرف أو أكثر","error");
    return;
  }

  auth.createUserWithEmailAndPassword(email,password)
  .then(()=>{
    showLoginMessage("تم إنشاء الحساب بنجاح","success");
  })
  .catch(error=>{
    showLoginMessage(error.message,"error");
  });
}

function logout(){
  auth.signOut();
}

auth.onAuthStateChanged(user=>{
  currentUser = user;

  if(user){
    document.getElementById("loginPage").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");

    document.getElementById("userInfo").textContent =
      "الحساب: " + user.email;

    document.getElementById("settingsEmail").textContent =
      user.email;

    loadCloudData();
  }else{
    document.getElementById("loginPage").classList.remove("hidden");
    document.getElementById("app").classList.add("hidden");
  }
});

/* =========================
   CLOUD
========================= */

function userDoc(){
  return db.collection("users").doc(currentUser.uid);
}

async function loadCloudData(){

  try{

    const doc = await userDoc().get();

    if(doc.exists){

      const cloud = doc.data();

      data = {
        customers: cloud.customers || [],
        companies: cloud.companies || [],
        transfers: cloud.transfers || [],
        payments: cloud.payments || []
      };

      localStorage.setItem("remittanceData",JSON.stringify(data));

    }else{

      const local = localStorage.getItem("remittanceData");

      if(local){
        data = JSON.parse(local);
      }

      await syncNow();
    }

    renderAll();

  }catch(error){

    console.error(error);

    const local = localStorage.getItem("remittanceData");

    if(local){
      data = JSON.parse(local);
    }

    renderAll();
  }
}

async function syncNow(){

  if(!currentUser){
    return;
  }

  try{

    await userDoc().set({
      customers:data.customers,
      companies:data.companies,
      transfers:data.transfers,
      payments:data.payments,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    },{merge:true});

    localStorage.setItem(
      "remittanceData",
      JSON.stringify(data)
    );

    showSyncMessage("تمت المزامنة بنجاح","success");

  }catch(error){

    console.error(error);

    showSyncMessage(
      "فشلت المزامنة: " + error.message,
      "error"
    );
  }
}

function saveLocal(){

  localStorage.setItem(
    "remittanceData",
    JSON.stringify(data)
  );

  renderAll();
  syncNow();
}

/* =========================
   CUSTOMERS
========================= */

function addCustomer(){

  const name =
    document.getElementById("customerName").value.trim();

  if(!name){
    alert("اكتب اسم العميل");
    return;
  }

  data.customers.push({
    id: Date.now().toString(),
    name:name,
    phone:document.getElementById("customerPhone").value.trim(),
    address:document.getElementById("customerAddress").value.trim(),
    createdAt:new Date().toISOString()
  });

  document.getElementById("customerName").value="";
  document.getElementById("customerPhone").value="";
  document.getElementById("customerAddress").value="";

  saveLocal();
}

function deleteCustomer(id){

  if(!confirm("هل تريد حذف العميل؟")) return;

  data.customers =
    data.customers.filter(x=>x.id!==id);

  saveLocal();
}

function renderCustomers(){

  const box =
    document.getElementById("customersTable");

  if(!data.customers.length){
    box.innerHTML="<p>لا يوجد عملاء</p>";
    return;
  }

  box.innerHTML=`
  <table>
  <thead>
  <tr>
  <th>الاسم</th>
  <th>الهاتف</th>
  <th>العنوان</th>
  <th>حذف</th>
  </tr>
  </thead>
  <tbody>
  ${data.customers.map(c=>`
    <tr>
      <td>${esc(c.name)}</td>
      <td>${esc(c.phone)}</td>
      <td>${esc(c.address)}</td>
      <td>
        <button class="btn red"
        onclick="deleteCustomer('${c.id}')">حذف</button>
      </td>
    </tr>
  `).join("")}
  </tbody>
  </table>`;
}

/* =========================
   COMPANIES
========================= */

function addCompany(){

  const name =
    document.getElementById("companyName").value.trim();

  if(!name){
    alert("اكتب اسم الشركة");
    return;
  }

  data.companies.push({
    id:Date.now().toString(),
    name:name,
    phone:document.getElementById("companyPhone").value.trim(),
    notes:document.getElementById("companyNotes").value.trim(),
    createdAt:new Date().toISOString()
  });

  document.getElementById("companyName").value="";
  document.getElementById("companyPhone").value="";
  document.getElementById("companyNotes").value="";

  saveLocal();
}

function deleteCompany(id){

  if(!confirm("هل تريد حذف الشركة؟")) return;

  data.companies =
    data.companies.filter(x=>x.id!==id);

  saveLocal();
}

function renderCompanies(){

  const box =
    document.getElementById("companiesTable");

  if(!data.companies.length){
    box.innerHTML="<p>لا توجد شركات</p>";
    updateCompanySelect();
    return;
  }

  box.innerHTML=`
  <table>
  <thead>
  <tr>
  <th>الشركة</th>
  <th>الهاتف</th>
  <th>ملاحظات</th>
  <th>حذف</th>
  </tr>
  </thead>
  <tbody>
  ${data.companies.map(c=>`
  <tr>
    <td>${esc(c.name)}</td>
    <td>${esc(c.phone)}</td>
    <td>${esc(c.notes)}</td>
    <td>
      <button class="btn red"
      onclick="deleteCompany('${c.id}')">حذف</button>
    </td>
  </tr>
  `).join("")}
  </tbody>
  </table>`;

  updateCompanySelect();
}

function updateCompanySelect(){

  const select =
    document.getElementById("transferCompany");

  select.innerHTML =
    `<option value="">اختر الشركة</option>` +
    data.companies.map(c=>
      `<option value="${c.id}">
      ${esc(c.name)}
      </option>`
    ).join("");
}

/* =========================
   TRANSFERS
========================= */

function addTransfer(){

  const sender =
    document.getElementById("transferSender").value.trim();

  const receiver =
    document.getElementById("transferReceiver").value.trim();

  const amount =
    Number(document.getElementById("transferAmount").value);

  if(!sender || !receiver || !amount){
    alert("أكمل بيانات الحوالة");
    return;
  }

  data.transfers.push({

    id:Date.now().toString(),

    sender:sender,

    receiver:receiver,

    phone:
      document.getElementById("transferPhone").value.trim(),

    companyId:
      document.getElementById("transferCompany").value,

    amount:amount,

    currency:
      document.getElementById("transferCurrency").value,

    number:
      document.getElementById("transferNumber").value.trim(),

    status:
      document.getElementById("transferStatus").value,

    notes:
      document.getElementById("transferNotes").value.trim(),

    createdAt:new Date().toISOString()
  });

  [
    "transferSender",
    "transferReceiver",
    "transferPhone",
    "transferAmount",
    "transferNumber",
    "transferNotes"
  ].forEach(id=>{
    document.getElementById(id).value="";
  });

  saveLocal();
}

function deleteTransfer(id){

  if(!confirm("هل تريد حذف الحوالة؟")) return;

  data.transfers =
    data.transfers.filter(x=>x.id!==id);

  saveLocal();
}

function companyName(id){

  const company =
    data.companies.find(x=>x.id===id);

  return company ? company.name : "-";
}

function statusName(status){

  if(status==="paid") return "مسددة";
  if(status==="cancelled") return "ملغاة";

  return "معلقة";
}

function renderTransfers(){

  const box =
    document.getElementById("transfersTable");

  if(!data.transfers.length){
    box.innerHTML="<p>لا توجد حوالات</p>";
    return;
  }

  box.innerHTML=`
  <table>
  <thead>
  <tr>
  <th>رقم</th>
  <th>المرسل</th>
  <th>المستلم</th>
  <th>الشركة</th>
  <th>المبلغ</th>
  <th>العملة</th>
  <th>الحالة</th>
  <th>حذف</th>
  </tr>
  </thead>
  <tbody>
  ${data.transfers.map(t=>`
  <tr>
    <td>${esc(t.number)}</td>
    <td>${esc(t.sender)}</td>
    <td>${esc(t.receiver)}</td>
    <td>${esc(companyName(t.companyId))}</td>
    <td>${Number(t.amount).toLocaleString()}</td>
    <td>${esc(t.currency)}</td>
    <td>${statusName(t.status)}</td>
    <td>
      <button class="btn red"
      onclick="deleteTransfer('${t.id}')">
      حذف
      </button>
    </td>
  </tr>
  `).join("")}
  </tbody>
  </table>`;
}

/* =========================
   PAYMENTS
========================= */

function addPayment(){

  const number =
    document.getElementById("paymentTransferNumber").value.trim();

  const amount =
    Number(document.getElementById("paymentAmount").value);

  if(!number || !amount){
    alert("أدخل رقم الحوالة والمبلغ");
    return;
  }

  data.payments.push({
    id:Date.now().toString(),
    transferNumber:number,
    amount:amount,
    notes:
      document.getElementById("paymentNotes").value.trim(),
    createdAt:new Date().toISOString()
  });

  const transfer =
    data.transfers.find(t=>t.number===number);

  if(transfer){
    transfer.status="paid";
  }

  document.getElementById("paymentTransferNumber").value="";
  document.getElementById("paymentAmount").value="";
  document.getElementById("paymentNotes").value="";

  saveLocal();
}

function deletePayment(id){

  if(!confirm("هل تريد حذف التسديد؟")) return;

  data.payments =
    data.payments.filter(x=>x.id!==id);

  saveLocal();
}

function renderPayments(){

  const box =
    document.getElementById("paymentsTable");

  if(!data.payments.length){
    box.innerHTML="<p>لا توجد تسديدات</p>";
    return;
  }

  box.innerHTML=`
  <table>
  <thead>
  <tr>
  <th>رقم الحوالة</th>
  <th>المبلغ</th>
  <th>الملاحظات</th>
  <th>التاريخ</th>
  <th>حذف</th>
  </tr>
  </thead>
  <tbody>
  ${data.payments.map(p=>`
  <tr>
    <td>${esc(p.transferNumber)}</td>
    <td>${Number(p.amount).toLocaleString()}</td>
    <td>${esc(p.notes)}</td>
    <td>${formatDate(p.createdAt)}</td>
    <td>
      <button class="btn red"
      onclick="deletePayment('${p.id}')">
      حذف
      </button>
    </td>
  </tr>
  `).join("")}
  </tbody>
  </table>`;
}

/* =========================
   DASHBOARD
========================= */

function renderDashboard(){

  document.getElementById("statCustomers").textContent =
    data.customers.length;

  document.getElementById("statCompanies").textContent =
    data.companies.length;

  document.getElementById("statTransfers").textContent =
    data.transfers.length;

  const total =
    data.transfers.reduce(
      (sum,t)=>sum+Number(t.amount||0),0
    );

  document.getElementById("statAmount").textContent =
    total.toLocaleString();

  const recent =
    [...data.transfers]
    .reverse()
    .slice(0,10);

  const box =
    document.getElementById("recentTransfers");

  if(!recent.length){
    box.innerHTML="<p>لا توجد حوالات</p>";
    return;
  }

  box.innerHTML=`
  <table>
  <thead>
  <tr>
  <th>رقم الحوالة</th>
  <th>المستلم</th>
  <th>المبلغ</th>
  <th>الحالة</th>
  </tr>
  </thead>
  <tbody>
  ${recent.map(t=>`
  <tr>
    <td>${esc(t.number)}</td>
    <td>${esc(t.receiver)}</td>
    <td>${Number(t.amount).toLocaleString()} ${esc(t.currency)}</td>
    <td>${statusName(t.status)}</td>
  </tr>
  `).join("")}
  </tbody>
  </table>`;
}

/* =========================
   REPORT
========================= */

function generateReport(){

  const from =
    document.getElementById("reportFrom").value;

  const to =
    document.getElementById("reportTo").value;

  let list = data.transfers;

  if(from){
    list =
      list.filter(t=>
        t.createdAt.substring(0,10)>=from
      );
  }

  if(to){
    list =
      list.filter(t=>
        t.createdAt.substring(0,10)<=to
      );
  }

  const total =
    list.reduce(
      (s,t)=>s+Number(t.amount||0),0
    );

  document.getElementById("reportResult").innerHTML=`
    <hr>
    <h3>عدد الحوالات: ${list.length}</h3>
    <h3>إجمالي المبالغ: ${total.toLocaleString()}</h3>

    <table>
    <thead>
    <tr>
    <th>التاريخ</th>
    <th>الرقم</th>
    <th>المرسل</th>
    <th>المستلم</th>
    <th>المبلغ</th>
    <th>الحالة</th>
    </tr>
    </thead>
    <tbody>
    ${list.map(t=>`
    <tr>
      <td>${formatDate(t.createdAt)}</td>
      <td>${esc(t.number)}</td>
      <td>${esc(t.sender)}</td>
      <td>${esc(t.receiver)}</td>
      <td>${Number(t.amount).toLocaleString()} ${esc(t.currency)}</td>
      <td>${statusName(t.status)}</td>
    </tr>
    `).join("")}
    </tbody>
    </table>
  `;
}

/* =========================
   BACKUP
========================= */

function backup(){

  const blob =
    new Blob(
      [JSON.stringify(data,null,2)],
      {type:"application/json"}
    );

  const url =
    URL.createObjectURL(blob);

  const a =
    document.createElement("a");

  a.href=url;
  a.download=
    "remittance-backup-" +
    new Date().toISOString().slice(0,10) +
    ".json";

  a.click();

  URL.revokeObjectURL(url);
}

function restoreBackup(event){

  const file =
    event.target.files[0];

  if(!file) return;

  const reader =
    new FileReader();

  reader.onload=function(){

    try{

      const restored =
        JSON.parse(reader.result);

      data={
        customers:restored.customers||[],
        companies:restored.companies||[],
        transfers:restored.transfers||[],
        payments:restored.payments||[]
      };

      saveLocal();

      alert("تمت استعادة النسخة الاحتياطية");

    }catch(e){

      alert("ملف النسخة الاحتياطية غير صالح");
    }
  };

  reader.readAsText(file);
}

/* =========================
   NAVIGATION
========================= */

function showPage(id){

  document.querySelectorAll(".page")
    .forEach(p=>p.classList.add("hidden"));

  const page =
    document.getElementById(id);

  if(page){
    page.classList.remove("hidden");
  }

  renderAll();
}

/* =========================
   RENDER
========================= */

function renderAll(){

  renderDashboard();
  renderCustomers();
  renderCompanies();
  renderTransfers();
  renderPayments();
}

/* =========================
   HELPERS
========================= */

function esc(value){

  return String(value??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function formatDate(date){

  if(!date) return "";

  try{

    return new Date(date)
      .toLocaleString("ar-IQ");

  }catch(e){

    return date;
  }
}

function showLoginMessage(text,type){

  const box =
    document.getElementById("loginMessage");

  box.className =
    "message " + type;

  box.textContent=text;
}

function showSyncMessage(text,type){

  const box =
    document.getElementById("syncMessage");

  box.className =
    "message " + type;

  box.textContent=text;
}

/* =========================
   LOCAL START
========================= */

const saved =
  localStorage.getItem("remittanceData");

if(saved){

  try{

    data=JSON.parse(saved);

  }catch(e){}
}

renderAll();

</script>
